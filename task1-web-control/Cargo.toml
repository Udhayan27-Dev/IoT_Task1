[package]
edition      = "2024"
name         = "led-web-control"
rust-version = "1.88"
version      = "0.1.0"

[[bin]]
name = "led-web-control"
path = "./src/bin/main.rs"

[dependencies]
esp-hal = { version = "~1.1.0", features = ["esp32c3", "log-04", "unstable"] }

esp-rtos = { version = "0.3.0", features = ["embassy", "esp32c3", "log-04","esp-radio"] }

esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32c3", "log-04"] }
log                    = "0.4.27"

embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-time = { version = "0.5.0", features = ["log"] }
esp-backtrace = { version = "0.19.0", features = [
  "esp32c3",
  "panic-handler",
  "println",
] }
esp-println = { version = "0.17.0", features = ["esp32c3", "log-04"] }

critical-section = "1.2.0"
static_cell      = "2.1.1"

esp-radio = { version = "0.18", features = ["esp32c3", "wifi", "unstable", "log-04"] }
esp-alloc = { version = "0.10", features = ["esp32c3"] }
embassy-net = { version = "0.9", features = ["dhcpv4", "log", "medium-ethernet", "tcp", "udp"] }
embedded-io = "0.7"
embedded-io-async = "0.7"

# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 3
